name: Generate report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *" # daily at 10am UTC, before most of us start work

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}

jobs:
  report:
    name: Generate report

    runs-on: blacksmith-32vcpu-ubuntu-2404

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Dump system information
        run: |
          lscpu

      - name: Check out code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Check out tpuf repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: turbopuffer/turbopuffer
          path: turbopuffer
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c

      - name: Launch turbopuffer
        run: |
          # Install OpenBLAS.
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

          # Make fake cache directory.
          sudo mkdir -p /mnt/disks/localssd/tpuf-staging-cache
          sudo chown $USER /mnt/disks/localssd/tpuf-staging-cache

          # Set up devbox-like environment.
          cd turbopuffer
          source devbox/env.sh
          # TODO: use a machine that supports the CPU features we use in
          # production.
          export RUSTFLAGS="-C target-cpu=native --cfg tokio_unstable"
          # Ensure we wait for reindex after full compaction to complete.
          sed -i 's/^\(wait_for_indexing_to_finish = \).*/\1true/' settings/default.toml

          # Build and run tpuf.
          cargo build --release --bin tpuf
          # Use a custom blob system prefix to avoid conflicting with other devboxes
          # Use ENV=benchmark instead of the default, which is "test".
          env 'TPUF_BLOB.SYSTEM_PREFIX=system/search-benchmark-game' ENV=benchmark HOSTNAME=`hostname` cargo run --release --bin tpuf server &> tpuf.log &

          # Wait for tpuf to become available.
          # TODO: do this more robustly.
          sleep 1
          cat tpuf.log

      - name: Cache corpus
        id: cache-corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: corpus.json
          key: corpus-with-filters

      - name: Download corpus
        if: steps.cache-corpus.outputs.cache-hit != 'true'
        run: make corpus

      - name: Compile engines
        run: make compile

      - name: Build indexes
        run: make index

      - name: Merge segments
        run: |
          cd turbopuffer
          source devbox/env.sh

          # `make index` returns once /metadata reports no unindexed bytes, which is
          # before the index job completes. Wait for it, so that nothing is indexing
          # while segments merge.
          for i in $(seq 1 100); do
            grep -q "done incremental indexing" tpuf.log && break
            echo "waiting for the initial index job to complete..."
            sleep 10
          done
          if ! grep -q "done incremental indexing" tpuf.log; then
            echo "ERROR: gave up waiting for the initial index job after 100 iterations"
            exit 1
          fi

          # Stop the server: the merge opens the same cache directory and debug port,
          # and must not race with indexing.
          target/release/tpuf begin-shutdown || pkill -f 'target/release/tpuf server'
          for i in $(seq 1 60); do
            pgrep -f 'target/release/tpuf server' > /dev/null || break
            sleep 1
          done
          pkill -9 -f 'target/release/tpuf server' || true

          # Merge every segment of the namespace into one. This waits for the merge
          # to complete. Same environment as the server, so it sees the same data.
          # Only works with the test API key where the API key *is* the org ID.
          env 'TPUF_BLOB.SYSTEM_PREFIX=system/search-benchmark-game' ENV=benchmark HOSTNAME=`hostname` \
            target/release/tpuf segments-full-merge $TURBOPUFFER_API_KEY search-benchmark-game

          # Restart the server with the binary built earlier: `cargo run` here would
          # rebuild, since RUSTFLAGS from the launch step don't carry over.
          env 'TPUF_BLOB.SYSTEM_PREFIX=system/search-benchmark-game' ENV=benchmark HOSTNAME=`hostname` \
            nohup target/release/tpuf server >> tpuf.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:3000 && break
            sleep 1
          done

      - name: Run benchmarks
        run: make bench

      - name: Publish results
        run: make publish
        env:
          GIT_AUTHOR_NAME: turbobot
          GIT_AUTHOR_EMAIL: bot@turbopuffer.com
          GIT_COMMITTER_NAME: turbobot
          GIT_COMMITTER_EMAIL: bot@turbopuffer.com

      - name: Upload turbopuffer logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tpuf.log
          path: turbopuffer/tpuf.log

      - name: Upload GitHub Pages artifacts
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
